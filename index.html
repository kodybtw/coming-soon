<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Open In 2050 — Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background: #050505;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139,92,246,0.4), transparent);
      filter: blur(120px);
      top: -100px;
      left: -100px;
    }
    .glow2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59,130,246,0.4), transparent);
      filter: blur(120px);
      bottom: -100px;
      right: -100px;
    }
    .container {
      position: relative;
      z-index: 2;
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    p {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 18px;
    }
    .funding {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      margin: 0 auto;
      max-width: 480px;
    }
    .amounts {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .raised {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
    }
    .of {
      font-size: 18px;
      color: #777;
      font-weight: 500;
    }
    .goal {
      font-size: 28px;
      color: #aaa;
      font-weight: 700;
    }
    .progress {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(139,92,246,0.6);
      animation: fill 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }
    @keyframes fill {
      to { width: 42.7%; }
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 13px;
      color: #777;
    }
    .progress-meta strong {
      color: #ccc;
      font-weight: 600;
    }
    .pulse {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }
    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="container">
    <h1>Open In 2050</h1>
    <p>Help us reach our $1,000 goal to launch the project</p>

    <div class="funding">
      <div class="amounts">
        <span class="raised">$427</span>
        <span class="of">of</span>
        <span class="goal">$1,000</span>
      </div>

      <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="progress-meta">
        <span><strong id="percent">42.7%</strong> raised</span>
        <span><strong id="remaining">$573</strong> to go</span>
      </div>
    </div>

    <div class="pulse">⏳ Something big is coming...</div>

    <div class="buttons">
      <button onclick="sharePage()">🚀 Share</button>
      <button onclick="window.location.href='/faq'">❓ FAQ</button>
    </div>

    <div class="footer">
      © 2026 Open In 2050
    </div>
  </div>

  <script>
    const goal = 1000;
    const raised = 427;
    const percent = (raised / goal) * 100;
    const remaining = goal - raised;

    document.getElementById("percent").textContent = percent.toFixed(1) + "%";
    document.getElementById("remaining").textContent = "$" + remaining;

    // Dynamic fill width based on actual percent
    const fill = document.getElementById("progressFill");
    fill.style.setProperty("animation", "none");
    requestAnimationFrame(() => {
      fill.style.transition = "width 1.8s cubic-bezier(0.22, 1, 0.36, 1)";
      setTimeout(() => { fill.style.width = percent + "%"; }, 300);
    });

    function sharePage() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: "Open In 2050",
          text: "Help us launch — we're raising $1,000 👀",
          url
        });
      } else {
        navigator.clipboard.writeText(url);
        alert("Link copied!");
      }
    }
  </script>
</body>
</html>
